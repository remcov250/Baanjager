services:
  baanjager:
    # Pull the published image, or `docker compose up --build` to build locally.
    image: ghcr.io/remcov250/baanjager:latest
    build: .
    container_name: baanjager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # A named volume: the container runs as uid 1001 and Docker sets the
      # ownership for you. If you'd rather bind-mount a folder, chown it to
      # 1001:1001 first.
      - baanjager-data:/data
    environment:
      DEFAULT_LOCALE: nl
      # Dates default to "today" in this zone; without it the container is on UTC.
      TZ: Europe/Amsterdam
      # Set to "true" behind a reverse proxy, so login rate limiting keys on the
      # real client address (X-Forwarded-For). The session cookie gets its Secure
      # flag from X-Forwarded-Proto: https, or from COOKIE_SECURE=true.
      TRUST_PROXY: "false"
      # Leave empty to keep the REST API and MCP off. Generate one with:
      #   openssl rand -hex 32
      API_TOKEN: ${API_TOKEN:-}

volumes:
  baanjager-data:
